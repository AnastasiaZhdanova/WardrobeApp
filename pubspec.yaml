name: wardrobe_app
description: "A private wardrobe app with an AI styling assistant; a human stylist approves every outfit."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  http: ^1.6.0
  riverpod_annotation: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.9
  freezed: 4.0.0-dev.3
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  assets:
    - assets/wardrobe/
